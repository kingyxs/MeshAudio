[workspace]

[package]
name = "meshaudio-desktop"
version = "0.3.1"
description = "MeshAudio desktop Tauri shell"
authors = ["MeshAudio"]
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "meshaudio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
opt-level = "s"
