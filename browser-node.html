<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161c">
<title>MeshAudio 网页麦克风</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #12161c;
    --card: #1a2028;
    --line: #2b3440;
    --text: #e6edf5;
    --muted: #94a3b5;
    --accent: #4db6ac;
    --danger: #e57373;
    --warn: #e0a458;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .banner {
    border-radius: 12px;
    padding: 11px 13px;
    font-size: 13px;
    margin-bottom: 12px;
    background: rgba(224, 164, 88, .12);
    border: 1px solid rgba(224, 164, 88, .45);
    color: var(--warn);
  }
  .banner.bad { background: rgba(229, 115, 115, .12); border-color: rgba(229, 115, 115, .5); color: var(--danger); }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type="text"], input[type="file"] {
    width: 100%;
    background: #12171e;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 15px;
    margin-bottom: 14px;
  }
  .seg { display: flex; gap: 8px; margin-bottom: 14px; }
  .seg button {
    flex: 1;
    background: #12171e;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--muted);
    padding: 10px 0;
    font-size: 14px;
  }
  .seg button.active { border-color: var(--accent); color: var(--accent); background: rgba(77, 182, 172, .1); }
  .actions { display: flex; gap: 8px; }
  .actions button {
    flex: 1;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #12171e;
    color: var(--text);
    padding: 12px 0;
    font-size: 15px;
  }
  .actions button.primary { background: var(--accent); border-color: var(--accent); color: #0b1216; font-weight: 600; }
  .actions button:disabled { opacity: .4; }
  #testTone { width: 100%; margin-bottom: 14px; background: #12171e; border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 10px 0; font-size: 14px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; font-size: 13px; }
  .stats div { display: flex; justify-content: space-between; gap: 8px; }
  .stats span { color: var(--muted); }
  .stats strong { font-weight: 500; font-variant-numeric: tabular-nums; }
  .meter { grid-column: 1 / -1; height: 6px; background: #12171e; border-radius: 3px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0%; background: var(--accent); transition: width .12s linear; }
  .hint { color: var(--muted); font-size: 12px; line-height: 1.75; }
  .hint p { margin: 0 0 6px; }
  .hint strong { color: var(--text); font-weight: 500; }
</style>
</head>
<body>
<main>
  <h1 id="pageTitle">网页麦克风</h1>
  <p class="sub">把此设备的麦克风作为一个来源接入 MeshAudio 画布</p>

  <div class="banner" id="envWarn" hidden></div>

  <section class="card">
    <label for="deviceName">设备名（显示在画布来源卡片上）</label>
    <input type="text" id="deviceName" maxlength="48" value="网页麦克风" autocomplete="off">

    <label id="modeLabel">流类型</label>
    <div class="seg" id="modeGroup">
      <button type="button" data-mode="microphone" class="active">麦克风</button>
      <button type="button" data-mode="media">网页音频</button>
    </div>

    <div id="mediaPanel" hidden>
      <label for="mediaFile">选择本地音频文件（循环播放）</label>
      <input type="file" id="mediaFile" accept="audio/*">
      <button type="button" id="testTone">或改用 440 Hz 测试音</button>
    </div>

    <div class="actions">
      <button type="button" id="start" class="primary">开始推流</button>
      <button type="button" id="stop" disabled>停止</button>
    </div>
  </section>

  <section class="card stats">
    <div><span>状态</span><strong id="status">未开始</strong></div>
    <div><span>输入采样率</span><strong id="sampleRate">—</strong></div>
    <div><span>已发送</span><strong id="packets">0</strong></div>
    <div><span>丢弃</span><strong id="dropped">0</strong></div>
    <div class="meter"><i id="level"></i></div>
  </section>

  <section class="hint">
    <p><strong>必须 HTTPS</strong>（或 localhost），否则浏览器不会给出麦克风权限，这是平台硬限制。</p>
    <p><strong>iOS 锁屏 / 切到后台会中断采集</strong>，页面回到前台后需要重新点开始。</p>
    <p>只采集<strong>此设备麦克风</strong>，不采集手机其他应用的声音。</p>
    <p>发送格式与手机节点一致（MSA1 + float32 PCM），因此画布、混音、路由、语音链全部复用。</p>
  </section>
</main>
<script src="/browser-node.js"></script>
</body>
</html>
